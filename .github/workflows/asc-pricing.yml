name: App Store pricing
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or apply
        default: inspect
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography requests
      - run: python3 tools/asc_pricing.py "${{ inputs.mode }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
