name: App Store Connect tools
on:
  workflow_dispatch:
    inputs:
      script:
        description: tools/<script>.py
        default: asc_pricing
      mode:
        description: argument
        default: inspect
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography requests
      - run: python3 "tools/${{ inputs.script }}.py" "${{ inputs.mode }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
