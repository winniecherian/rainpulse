name: Data probe
on:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          T0=$(date -u +%Y-%m-%dT%H:00:00Z); T1=$(date -u -d '+24 hours' +%Y-%m-%dT%H:00:00Z)
          for base in https://pae-paha.pacioos.hawaii.edu/erddap https://upwell.pfeg.noaa.gov/erddap; do
            echo "== $base"
            curl -sL -m 90 "$base/info/ncep_global/index.csv" -o info.csv -w "info HTTP %{http_code} %{time_total}s\n"
            grep -E "^variable|pratesfc|apcpsfc" info.csv | head -20
            curl -sL -m 90 "$base/griddap/ncep_global.json?pratesfc%5B($T0):1:($T1)%5D%5B(8):2:(16)%5D%5B(76):2:(84)%5D" -o p.json -w "prate HTTP %{http_code} %{size_download}B %{time_total}s\n"
            head -c 900 p.json; echo
          done
