name: Data probe
on:
  push:
    paths: [".github/workflows/data-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s -m 40 "https://www.gdacs.org/gdacsapi/api/polygons/getgeometry?eventtype=TC&eventid=1001351&episodeid=13" -o geo.json -w "geo HTTP %{http_code} %{size_download}B\n"
          python3 - <<'PY'
          import json
          d = json.load(open("geo.json"))
          skip = {"url","htmldescription","icon","iconoverall","iconeventlink","iconitemlink","affectedcountries","description","name","glide","eventtype","eventid","episodeid","istemporary","iscurrent","source","sourceid","fromdate","todate","datemodified","iso3","country","countryonland","severitydata","alertscore","episodealertscore","eventname"}
          for f in d["features"]:
              p = {k: v for k, v in f["properties"].items() if k not in skip}
              g = f["geometry"]
              print(g["type"], p, str(g["coordinates"])[:90] if g["type"] != "Polygon" else len(g["coordinates"][0]))
          PY
          echo "=== details ==="
          curl -s -m 40 "https://www.gdacs.org/gdacsapi/api/events/geteventdata?eventtype=TC&eventid=1001351" | head -c 1500; echo
          echo "=== ERDDAP GFS wind (follow redirects) ==="
          for base in https://coastwatch.pfeg.noaa.gov/erddap/griddap/NCEP_Global_Best https://upwell.pfeg.noaa.gov/erddap/griddap/ncep_global; do
            echo "-- $base"
            curl -sL -m 60 "$base.json?ugrd10m%5B(last)%5D%5B(5):4:(25)%5D%5B(70):4:(95)%5D,vgrd10m%5B(last)%5D%5B(5):4:(25)%5D%5B(70):4:(95)%5D" -o w.json -w "HTTP %{http_code} %{size_download}B %{time_total}s final=%{url_effective}\n"
            head -c 900 w.json; echo
          done
          echo "=== Open-Meteo multi-location wind (100 points) ==="
          lats=$(python3 -c "print(','.join(str(5+2*i) for i in range(10) for j in range(10)))")
          lons=$(python3 -c "print(','.join(str(70+2.5*j) for i in range(10) for j in range(10)))")
          curl -s -m 60 "https://api.open-meteo.com/v1/forecast?latitude=$lats&longitude=$lons&current=wind_speed_10m,wind_direction_10m" -o om.json -w "OM HTTP %{http_code} %{size_download}B %{time_total}s\n"
          head -c 300 om.json; echo
