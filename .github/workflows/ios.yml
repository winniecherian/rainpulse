name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Write Secrets.xcconfig
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          {
            echo "OWM_API_KEY = $OWM_API_KEY"
            echo "TOMORROW_API_KEY = $TOMORROW_API_KEY"
            echo "OPEN_METEO_API_KEY = $OPEN_METEO_API_KEY"
          } > Config/Secrets.xcconfig

      - name: Compile check (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild -project RainPulse.xcodeproj -scheme RainPulse \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true

      - name: Install App Store Connect key
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (cloud-managed signing)
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        run: |
          set -o pipefail
          xcodebuild -project RainPulse.xcodeproj -scheme RainPulse \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RainPulse.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>D62ZJ949AT</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RainPulse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
