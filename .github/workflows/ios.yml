name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "tools/**", "**.md", ".github/workflows/asc-pricing.yml", ".github/workflows/strings.yml", ".github/workflows/radar-check.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 27 (App Store requires the iOS 27 SDK from April 2027)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_27*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Write Secrets.xcconfig
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          {
            echo "OWM_API_KEY = $OWM_API_KEY"
            echo "TOMORROW_API_KEY = $TOMORROW_API_KEY"
            echo "OPEN_METEO_API_KEY = $OPEN_METEO_API_KEY"
          } > Config/Secrets.xcconfig

      - name: Compile check (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild -project RainPulse.xcodeproj -scheme RainPulse \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60 || true

      - name: Check live forecast API from CI
        run: curl -s -m 30 -o /dev/null -w "Open-Meteo HTTP %{http_code} in %{time_total}s\n" "https://api.open-meteo.com/v1/forecast?latitude=51.5&longitude=-0.12&current=temperature_2m" || true

      - name: UI tests on iPhone simulator (self-test + screenshots)
        id: uitests
        run: |
          set -o pipefail
          DEVICE=$( { xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro Max" || xcrun simctl list devices available | grep -E "iPhone" || true; } | sed -E 's/^ *([^(]+) \(.*/\1/' | xargs -L1 | sort -V | tail -1)
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcodebuild -project RainPulse.xcodeproj -scheme RainPulse -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 420 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | grep --line-buffered -E "Test Case|error:|failed|passed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Export screenshots and test summary
        if: always() && steps.uitests.outcome != 'skipped'
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tests.xcresult" --output-path shots || true
          ls shots | head -30
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" > shots/summary.json || true
          grep -E "Test Case|error:" test.log > shots/test-results.txt || true
          # Publish ONLY the exported screenshots, from a clean temp repo
          # (never the workspace, which holds Secrets.xcconfig).
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r shots/. /tmp/pub/
          cd /tmp/pub
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Install App Store Connect key
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Remember existing certificates
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography requests || python3 -m pip install -q --user pyjwt cryptography requests
          python3 tools/asc_certs.py snapshot "$RUNNER_TEMP/certs.json"

      - name: Archive (cloud-managed signing)
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        run: |
          set -o pipefail
          xcodebuild -project RainPulse.xcodeproj -scheme RainPulse \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RainPulse.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Show signed entitlements
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        run: |
          APP="$RUNNER_TEMP/RainPulse.xcarchive/Products/Applications/RainPulse.app"
          echo "== App =="; codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - || true
          echo "== Widget =="; codesign -d --entitlements :- "$APP/PlugIns/RainPulseWidget.appex" 2>/dev/null | plutil -p - || true

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>D62ZJ949AT</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RainPulse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Revoke this run's throwaway development certificate
        if: always() && env.ASC_KEY_ID != '' && (github.event_name == 'workflow_dispatch' && inputs.upload)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: '[ -f "$RUNNER_TEMP/certs.json" ] && python3 tools/asc_certs.py revoke-new "$RUNNER_TEMP/certs.json" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: "*.log"
          if-no-files-found: ignore
