name: Radar data check
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/radar-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
    steps:
      - name: Check radar tiles and current rain
        run: |
          pip install -q pillow requests
          python3 - <<'PY'
          import os, io, math, requests
          from PIL import Image
          key = os.environ.get("OWM_API_KEY", "")
          print("OWM key set:", bool(key), "length", len(key))
          def tile(lat, lon, z):
              n = 2 ** z
              x = int((lon + 180) / 360 * n)
              r = math.radians(lat)
              y = int((1 - math.log(math.tan(r) + 1 / math.cos(r)) / math.pi) / 2 * n)
              return x, y
          def coloured(url):
              r = requests.get(url, timeout=30)
              if r.status_code != 200:
                  return f"HTTP {r.status_code} {r.text[:120]!r}"
              im = Image.open(io.BytesIO(r.content)).convert("RGBA")
              px = list(im.getdata())
              vis = [p for p in px if p[3] > 0]
              strong = [p for p in px if p[3] > 80]
              return f"HTTP 200, {len(vis)} visible px, {len(strong)} clearly visible px of {len(px)}, max alpha {max(p[3] for p in px)}"
          # Current rain at a few places from Open-Meteo (to know where rain should show)
          places = {"Chennai": (13.08, 80.27), "Mumbai": (19.08, 72.88), "London": (51.51, -0.13),
                    "Singapore": (1.35, 103.82), "Tokyo": (35.68, 139.69), "Jakarta": (-6.2, 106.85)}
          for name, (la, lo) in places.items():
              j = requests.get("https://api.open-meteo.com/v1/forecast", params={"latitude": la, "longitude": lo, "current": "precipitation,rain,weather_code"}, timeout=30).json()
              print(f"{name}: now {j.get('current')}")
          print("--- OWM 1.0 precipitation_new (free layer) ---")
          for name, (la, lo) in places.items():
              for z in (3, 5):
                  x, y = tile(la, lo, z)
                  print(f"{name} z{z}: {coloured(f'https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid={key}')}")
          print("--- OWM 1.0 clouds_new (sanity check) ---")
          x, y = tile(13.08, 80.27, 3)
          print("clouds z3:", coloured(f"https://tile.openweathermap.org/map/clouds_new/3/{x}/{y}.png?appid={key}"))
          print("--- OWM 2.0 radar (animated layer, needs paid plan) ---")
          x, y = tile(13.08, 80.27, 5)
          print("2.0 radar:", coloured(f"https://maps.openweathermap.org/maps/2.0/radar/5/{x}/{y}?appid={key}"))
          print("2.0 PR0:", coloured(f"https://maps.openweathermap.org/maps/2.0/weather/PR0/5/{x}/{y}?appid={key}"))
          PY
