name: Xcode probe
on:
  push:
    paths: [".github/workflows/xcode-probe.yml"]
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers -productVersion
          ls -d /Applications/Xcode*.app
          for x in /Applications/Xcode_27*.app; do [ -d "$x" ] && DEVELOPER_DIR=$x/Contents/Developer xcrun --sdk iphoneos --show-sdk-version && echo "$x OK"; done
          xcrun simctl list runtimes | grep iOS
